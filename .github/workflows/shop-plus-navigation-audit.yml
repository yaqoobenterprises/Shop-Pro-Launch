name: Shop Plus navigation browser audit

on:
  push:
    branches:
      - feat/shop-plus-foundation-20261127
    paths:
      - .github/workflows/shop-plus-navigation-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    env:
      AUDIT_THEME: ${{ matrix.theme }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/shop-plus-audit" --no-save playwright@1.56.1
          "$RUNNER_TEMP/shop-plus-audit/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build and serve candidate
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/shop-plus-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/shop-plus-preview.log
          exit 1
      - name: Capture demo-only responsive navigation
        run: |
          mkdir -p browser-audit
          node --input-type=commonjs <<'NODE'
          const { chromium } = require(process.env.RUNNER_TEMP + '/shop-plus-audit/node_modules/playwright');
          const fs = require('node:fs');
          const widths = [320, 375, 390, 768, 1024, 1280, 1440, 1920];
          const records = [];
          const interactions = [];
          const theme = process.env.AUDIT_THEME;
          async function capture(page, width, surface, errors) {
            const metrics = await page.evaluate(() => ({
              viewport: window.innerWidth,
              documentWidth: document.documentElement.scrollWidth,
              bodyWidth: document.body.scrollWidth,
              mainWidth: document.querySelector('main')?.clientWidth ?? null,
              mainScrollWidth: document.querySelector('main')?.scrollWidth ?? null
            }));
            const appearance = await page.evaluate(() => ({
              theme: document.documentElement.dataset.theme,
              canvas: getComputedStyle(document.documentElement).getPropertyValue('--paper').trim(),
              accent: getComputedStyle(document.documentElement).getPropertyValue('--forest').trim()
            }));
            await page.screenshot({path: 'browser-audit/' + theme + '-' + width + '-' + surface + '.png', fullPage: true, animations: 'disabled'});
            records.push({width, surface, ...metrics, ...appearance, pageErrors: [...errors]});
          }
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              for (const width of widths) {
                const context = await browser.newContext({viewport:{width,height:900}, reducedMotion:'reduce', serviceWorkers:'block'});
                // Prevent all external requests: only local application and isolated sample data.
                await context.addInitScript(preference => localStorage.setItem('yaqoob-theme', preference), theme);
                await context.route('**/*', route => {
                  const url = new URL(route.request().url());
                  return url.origin === 'http://127.0.0.1:4173' ? route.continue() : route.abort();
                });
                const page = await context.newPage();
                const errors = [];
                page.on('pageerror', e => errors.push(e.message));
                try {
                  await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
                  const demo = page.getByRole('button',{name:'Explore demo',exact:true});
                  await demo.waitFor({timeout:15000});
                  await page.evaluate(() => document.fonts.ready);
                  await capture(page,width,'landing',errors);
                  await demo.click();
                  await page.locator('#main-content').waitFor({timeout:15000});
                  await page.getByRole('navigation',{name:'Main navigation'}).filter({visible:true}).first().waitFor();
                  await page.getByText('Loading workspace...',{exact:true}).waitFor({state:'hidden',timeout:15000});
                  await page.evaluate(() => document.fonts.ready);
                  await capture(page,width,'overview',errors);
                  const navigation = page.getByRole('navigation',{name:'Main navigation'}).filter({visible:true}).first();
                  const chrome = width >= 768 ? page.locator('#app-sidebar') : navigation;
                  for (const [label,surface,view] of [['Cashbook','cashbook','chat'],['Transactions','transactions','sales'],['Reports','reports','reports'],['LedgerMate AI','ai','ai'],['Accounts','accounts','accounts'],['Settings','settings','settings']]) {
                    try {
                      const target = chrome.getByRole('button',{name:label,exact:true}).filter({visible:true}).first();
                      if (!(await target.isVisible())) {
                        const more = navigation.getByRole('button',{name:'More navigation options'});
                        if (await more.isVisible()) await more.click();
                      }
                      if (!(await target.isVisible())) {
                        records.push({width,surface,skipped:'Navigation label not visible'});
                        continue;
                      }
                      await target.click();
                      await page.waitForURL('**/workspace/' + view, {timeout: 10000});
                      await page.locator('#main-content').waitFor();
                      await page.getByText('Loading workspace...',{exact:true}).waitFor({state:'hidden',timeout:15000});
                      await page.evaluate(() => document.fonts.ready);
                      await capture(page,width,surface,errors);
                    } catch (e) { records.push({width,surface,error:String(e)}); }
                  }
                  try {
                    const newEntry = (width >= 768 ? chrome : page.locator('header.app-header')).getByRole('button',{name:'New entry',exact:true});
                    await newEntry.click();
                    await page.waitForURL('**/workspace/chat');
                    await page.locator('#ledger-entry').waitFor();
                    await page.waitForFunction(() => document.activeElement?.id === 'ledger-entry');
                    await page.goBack();
                    await page.waitForURL('**/workspace/settings');
                    await page.goForward();
                    await page.waitForURL('**/workspace/chat');
                    await page.getByRole('button',{name:'Search workspace navigation'}).click();
                    const search = page.getByRole('searchbox',{name:'Search screens and actions'});
                    await search.waitFor();
                    await search.fill('transactions');
                    await search.press('ArrowDown');
                    await page.waitForFunction(() => document.activeElement?.id === 'command-result-0');
                    await page.keyboard.press('Enter');
                    await page.waitForURL('**/workspace/sales');
                    await page.getByRole('heading',{name:'Transactions',exact:true}).waitFor();
                    if (width >= 768) {
                      const collapse = chrome.getByRole('button',{name:'Collapse sidebar',exact:true});
                      if (!(await collapse.isVisible())) await chrome.getByRole('button',{name:'Expand sidebar',exact:true}).click();
                      await collapse.click();
                      await chrome.getByRole('button',{name:'Expand sidebar',exact:true}).waitFor();
                      await chrome.getByRole('button',{name:'Overview',exact:true}).click();
                      await page.waitForURL('**/workspace/dashboard');
                    } else {
                      await navigation.getByRole('button',{name:'More navigation options'}).click();
                      await page.getByRole('dialog',{name:'More navigation'}).waitFor();
                      await page.keyboard.press('Escape');
                      await page.getByRole('dialog',{name:'More navigation'}).waitFor({state:'hidden'});
                    }
                    interactions.push({width,passed:true});
                  } catch(e) { interactions.push({width,error:String(e)}); }
                } catch (e) { records.push({width,error:String(e)}); }
                finally { await context.close(); }
              }
            } finally {
              await browser.close();
              fs.writeFileSync('browser-audit/measurements.json',JSON.stringify(records,null,2));
              fs.writeFileSync('browser-audit/interactions.json',JSON.stringify(interactions,null,2));
            }
            console.log(JSON.stringify(records,null,2));
            console.log(JSON.stringify(interactions,null,2));
            if (interactions.length !== widths.length || interactions.some(r => !r.passed)) process.exitCode = 1;
            if (records.some(r => r.error || r.skipped || r.pageErrors?.length || r.theme !== theme || r.canvas !== (theme === 'dark' ? '#151922' : '#f5f6f8') || r.documentWidth > r.viewport || (r.mainWidth !== null && r.mainScrollWidth > r.mainWidth))) process.exitCode = 1;
          })().catch(error => { console.error(error); process.exitCode=1; });
          NODE
      - name: Upload screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shop-plus-navigation-${{ matrix.theme }}
          path: browser-audit/
          if-no-files-found: warn
          retention-days: 14
