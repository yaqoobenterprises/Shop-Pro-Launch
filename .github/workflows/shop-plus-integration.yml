name: Shop Plus isolated Supabase integration
on:
  push:
    branches:
      - feat/shop-plus-foundation-20261127
    paths:
      - .github/workflows/shop-plus-integration.yml
      - scripts/shop-plus-local-integration.mjs
      - supabase/migrations/**
      - api/ai-chat.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shop-plus-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start disposable local Supabase stack
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          mkdir -p "$RUNNER_TEMP/shop-plus-local"
          cd "$RUNNER_TEMP/shop-plus-local"
          "$GITHUB_WORKSPACE/node_modules/.bin/supabase" init
          "$GITHUB_WORKSPACE/node_modules/.bin/supabase" start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor
          "$GITHUB_WORKSPACE/node_modules/.bin/supabase" status -o env > "$RUNNER_TEMP/shop-plus-local.env"
      - name: Auth, upgrade and concurrent financial integration
        env:
          SHOP_PLUS_LOCAL_TEST: "1"
        run: |
          set -a
          source "$RUNNER_TEMP/shop-plus-local.env"
          set +a
          node scripts/shop-plus-local-integration.mjs
      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-integration-report
          path: integration-evidence.json
          if-no-files-found: warn
      - name: Stop disposable stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/shop-plus-local/supabase/config.toml" ]; then
            cd "$RUNNER_TEMP/shop-plus-local"
            "$GITHUB_WORKSPACE/node_modules/.bin/supabase" stop --no-backup
          fi
