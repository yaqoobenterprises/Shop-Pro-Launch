name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        id: dependency_audit
        continue-on-error: true
        run: npm audit

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint source
        run: npm run lint

      - name: Check strict TypeScript
        run: npm run check:strict

      - name: Check file size limits
        run: npm run check:size

      - name: Run tests
        env:
          VITE_SUPABASE_URL: https://supabase-ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
        run: npm test -- --reporter=dot

      - name: Build production app
        run: npm run build

      # Keep static analysis and regression tests running even when the
      # dependency audit fails, then preserve the audit as a required gate.
      - name: Enforce dependency audit result
        if: steps.dependency_audit.outcome == 'failure'
        run: |
          echo "::error::The dependency audit found unresolved vulnerabilities. See the audit report above."
          exit 1
