name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-real:
    name: Verify real local Supabase Auth and PostgREST
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start disposable local Supabase services
        timeout-minutes: 20
        run: |
          npx supabase init
          python3 - <<'PY'
          from pathlib import Path
          config = Path('supabase/config.toml')
          current = config.read_text()
          disabled = '[auth.mfa.totp]\nenroll_enabled = false\nverify_enabled = false'
          assert disabled in current, 'Supabase CLI TOTP config changed'
          config.write_text(current.replace(disabled,
              '[auth.mfa.totp]\nenroll_enabled = true\nverify_enabled = true'))
          PY
          npx supabase start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          npx supabase status -o json > "$RUNNER_TEMP/aqvora-status.json"
          echo "AQVORA_LOCAL_SUPABASE_STATUS=$RUNNER_TEMP/aqvora-status.json" >> "$GITHUB_ENV"

      - name: Exercise issued JWTs through PostgREST
        timeout-minutes: 5
        env:
          AQVORA_DISPOSABLE_STACK: '1'
        run: npx vitest run tests/aqvora_real_supabase.test.ts

      - name: Inspect disposable database security advisors
        run: npx supabase db advisors --local --type security --fail-on none

      - name: Stop disposable stack
        if: always()
        run: npx supabase stop || true

  postgres-concurrency:
    name: Verify isolated PostgreSQL migrations and sessions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: aqvora_test
          POSTGRES_DB: aqvora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test financial races across independent connections
        env:
          AQVORA_TEST_DATABASE_URL: postgresql://postgres:aqvora_test@localhost:5432/aqvora_test
          AQVORA_DISPOSABLE_DB: '1'
        run: npx vitest run tests/aqvora_postgres_concurrency.test.ts

      - name: Rehearse fresh and deployed migration orders
        env:
          AQVORA_TEST_DATABASE_URL: postgresql://postgres:aqvora_test@localhost:5432/aqvora_test
          AQVORA_DISPOSABLE_DB: '1'
        run: |
          pg_container=$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)
          test -n "$pg_container"
          AQVORA_TEST_PG_DOCKER_CONTAINER="$pg_container" npx vitest run tests/aqvora_migration_reconciliation.test.ts

      - name: Verify certified ledger snapshots and query plans
        env:
          AQVORA_TEST_DATABASE_URL: postgresql://postgres:aqvora_test@localhost:5432/aqvora_test
          AQVORA_DISPOSABLE_DB: '1'
        run: npx vitest run tests/aqvora_read_postgres.test.ts

  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Existing moderate advisories are reported but do not block validation; high/critical remain blocking.
        run: npm audit --audit-level=high

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint source
        run: npm run lint

      - name: Check strict TypeScript
        run: npm run check:strict

      - name: Check file size limits
        run: npm run check:size

      - name: Run tests
        env:
          VITE_SUPABASE_URL: https://supabase-ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
        run: npm test -- --reporter=dot

      - name: Build production app
        run: npm run build
