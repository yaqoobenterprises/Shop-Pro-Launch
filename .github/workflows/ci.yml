name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-concurrency:
    name: Verify independent PostgreSQL sessions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: aqvora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test financial races across independent connections
        env:
          AQVORA_TEST_DATABASE_URL: postgresql://postgres:aqvora_test@localhost:5432/postgres
        run: npx vitest run tests/aqvora_postgres_concurrency.test.ts

  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Existing moderate advisories are reported but do not block validation; high/critical remain blocking.
        run: npm audit --audit-level=high

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint source
        run: npm run lint

      - name: Check strict TypeScript
        run: npm run check:strict

      - name: Check file size limits
        run: npm run check:size

      - name: Run tests
        env:
          VITE_SUPABASE_URL: https://supabase-ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
        run: npm test -- --reporter=dot

      - name: Build production app
        run: npm run build
